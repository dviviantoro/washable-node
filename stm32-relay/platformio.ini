; washable relay controller - WeAct Studio STM32G030F6P6 (Cortex-M0+, 32 KB flash, 8 KB RAM)
; ESP32 link: USART2 on PA2 (TX) / PA3 (RX), 115200 8N1, 3.3 V. Serial in the STM32duino variant is already USART2 on these pins.
[env:weact_g030f6p6]
platform = ststm32
board = weact_g030f6p6
framework = arduino
upload_protocol = stlink          ; SWD with an ST-Link. Alternatives: cmsis-dap, jlink, serial (system bootloader)
monitor_speed = 115200
build_flags =
    -I ../shared/relay_proto
    -Os
