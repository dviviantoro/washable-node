<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640"><rect width="1100" height="640" rx="14" fill="#0F2B50"/><style>text{font-family:Helvetica,Arial,sans-serif;fill:#EAF4FF;font-size:13px} .t{font-size:20px;font-weight:700} .s{font-size:11px;fill:#8FA6C4} .b{font-weight:700} .m{font-family:Menlo,Consolas,monospace}</style><text x="550.0" y="34" class="t" text-anchor="middle">washable - system wiring</text><text x="550.0" y="54" class="s" text-anchor="middle">3.3 V serial between the boards, one common ground, one shared 5 V supply</text><rect x="40" y="110" width="260" height="330" rx="10" fill="#10244A" stroke="#3F6AA8" stroke-width="2"/><text x="170.0" y="138" class="b" text-anchor="middle">ESP32-3248S035</text><text x="170.0" y="156" class="s" text-anchor="middle">kiosk (3.5" touch, RGB LED)</text><rect x="60" y="180" width="220" height="150" rx="8" fill="#0B1A33" stroke="#2B73B0" stroke-width="2"/><text x="170.0" y="202" class="s" text-anchor="middle">P1 connector (4P 1.25 mm)</text><circle cx="280" cy="226" r="7" fill="#FF6B6B"/><text x="76" y="230" class="b" text-anchor="start">VIN</text><text x="170" y="230" class="s" text-anchor="start">5 V in</text><circle cx="280" cy="254" r="7" fill="#00B4C5"/><text x="76" y="258" class="b" text-anchor="start">IO1 / TX0</text><text x="170" y="258" class="s" text-anchor="start">UART0 TX</text><circle cx="280" cy="282" r="7" fill="#00B4C5"/><text x="76" y="286" class="b" text-anchor="start">IO3 / RX0</text><text x="170" y="286" class="s" text-anchor="start">UART0 RX</text><circle cx="280" cy="310" r="7" fill="#999"/><text x="76" y="314" class="b" text-anchor="start">GND</text><text x="170" y="314" class="s" text-anchor="start">ground</text><text x="170.0" y="360" class="s" text-anchor="middle">P1 pin order differs between board</text><text x="170.0" y="374" class="s" text-anchor="middle">revisions: follow the silkscreen labels.</text><text x="170.0" y="406" class="s" text-anchor="middle">Micro-USB / USB-C: power + flashing</text><text x="170.0" y="422" class="s" text-anchor="middle">(same UART0 as the P1 serial pins)</text><rect x="440" y="110" width="220" height="330" rx="10" fill="#10244A" stroke="#3F6AA8" stroke-width="2"/><text x="550.0" y="138" class="b" text-anchor="middle">WeAct STM32G030F6P6</text><text x="550.0" y="156" class="s" text-anchor="middle">relay controller</text><circle cx="440" cy="226" r="7" fill="#00B4C5"/><text x="456" y="230" class="b" text-anchor="start">PA3 (RX)</text><circle cx="440" cy="254" r="7" fill="#00B4C5"/><text x="456" y="258" class="b" text-anchor="start">PA2 (TX)</text><circle cx="440" cy="282" r="7" fill="#999"/><text x="456" y="286" class="b" text-anchor="start">GND</text><circle cx="440" cy="310" r="7" fill="#FF6B6B"/><text x="456" y="314" class="b" text-anchor="start">5V</text><circle cx="660" cy="180" r="7" fill="#3FA9F5"/><text x="644" y="184" class="b" text-anchor="end">PA0  CH1</text><circle cx="660" cy="212" r="7" fill="#3FA9F5"/><text x="644" y="216" class="b" text-anchor="end">PA1  CH2</text><circle cx="660" cy="244" r="7" fill="#3FA9F5"/><text x="644" y="248" class="b" text-anchor="end">PA5  CH3</text><circle cx="660" cy="276" r="7" fill="#3FA9F5"/><text x="644" y="280" class="b" text-anchor="end">PA6  CH4</text><circle cx="660" cy="308" r="7" fill="#FF9F43"/><text x="644" y="312" class="b" text-anchor="end">PA7  CH5</text><circle cx="660" cy="340" r="7" fill="#FF9F43"/><text x="644" y="344" class="b" text-anchor="end">PA8  CH6</text><circle cx="660" cy="372" r="7" fill="#FF9F43"/><text x="644" y="376" class="b" text-anchor="end">PA11  CH7</text><circle cx="660" cy="404" r="7" fill="#FF9F43"/><text x="644" y="408" class="b" text-anchor="end">PA12  CH8</text><text x="550.0" y="432" class="s" text-anchor="middle" style="fill:#B07CFF">SWD: PA13 / PA14 (ST-Link)</text><rect x="800" y="110" width="260" height="330" rx="10" fill="#10244A" stroke="#3F6AA8" stroke-width="2"/><text x="930.0" y="138" class="b" text-anchor="middle">8-channel relay board</text><text x="930.0" y="156" class="s" text-anchor="middle">opto-isolated, 5 V coils</text><circle cx="800" cy="180" r="7" fill="#3FA9F5"/><text x="816" y="184" class="b" text-anchor="start">IN1</text><text x="1044" y="184" class="s" text-anchor="end">wash CH1</text><circle cx="800" cy="212" r="7" fill="#3FA9F5"/><text x="816" y="216" class="b" text-anchor="start">IN2</text><text x="1044" y="216" class="s" text-anchor="end">wash CH2</text><circle cx="800" cy="244" r="7" fill="#3FA9F5"/><text x="816" y="248" class="b" text-anchor="start">IN3</text><text x="1044" y="248" class="s" text-anchor="end">wash CH3</text><circle cx="800" cy="276" r="7" fill="#3FA9F5"/><text x="816" y="280" class="b" text-anchor="start">IN4</text><text x="1044" y="280" class="s" text-anchor="end">wash CH4</text><circle cx="800" cy="308" r="7" fill="#FF9F43"/><text x="816" y="312" class="b" text-anchor="start">IN5</text><text x="1044" y="312" class="s" text-anchor="end">dry CH5</text><circle cx="800" cy="340" r="7" fill="#FF9F43"/><text x="816" y="344" class="b" text-anchor="start">IN6</text><text x="1044" y="344" class="s" text-anchor="end">dry CH6</text><circle cx="800" cy="372" r="7" fill="#FF9F43"/><text x="816" y="376" class="b" text-anchor="start">IN7</text><text x="1044" y="376" class="s" text-anchor="end">dry CH7</text><circle cx="800" cy="404" r="7" fill="#FF9F43"/><text x="816" y="408" class="b" text-anchor="start">IN8</text><text x="1044" y="408" class="s" text-anchor="end">dry CH8</text><path d="M280 254 L360 254 L360 226 L440 226" stroke="#00B4C5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 282 L380 282 L380 254 L440 254" stroke="#00B4C5" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 310 L400 310 L400 282 L440 282" stroke="#999" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 226 L420 226 L420 310 L440 310" stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="350" y="248" class="s" text-anchor="end" style="fill:#00B4C5">TX0 -&gt; PA3</text><text x="350" y="298" class="s" text-anchor="end" style="fill:#00B4C5">RX0 &lt;- PA2</text><path d="M660 180 L800 180" stroke="#3FA9F5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 212 L800 212" stroke="#3FA9F5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 244 L800 244" stroke="#3FA9F5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 276 L800 276" stroke="#3FA9F5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 308 L800 308" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 340 L800 340" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 372 L800 372" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M660 404 L800 404" stroke="#FF9F43" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="500" width="1020" height="100" rx="10" fill="#0B1A33" stroke="#2B73B0" stroke-width="2"/><text x="60" y="526" class="b" text-anchor="start">Power and safety</text><text x="60" y="548" class="s" text-anchor="start">5 V supply (&gt;= 2 A): ESP32 VIN, STM32 5V and relay board VCC share it; all grounds connected (ESP32 GND - STM32 GND - relay GND).</text><text x="60" y="564" class="s" text-anchor="start">Mains / pump / heater loads go only through the relay contacts, behind fuses and a hardware emergency stop that does not rely on software.</text><text x="60" y="580" class="s" text-anchor="start">Relay modules are often ACTIVE-LOW: set RELAY_ACTIVE_HIGH 0 in stm32-relay/src/main.cpp if the relays click on at power-up.</text><text x="60" y="596" class="s" text-anchor="start">Unplug the TX wire (or use a 1 k series resistor) while flashing the ESP32 over USB, because GPIO1/3 are also the USB console.</text></svg>