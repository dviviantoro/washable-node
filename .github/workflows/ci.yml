name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run_host_tests.sh
  esp32-kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('esp32-kiosk/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d esp32-kiosk
      - name: Cycle / relay logic checks (host simulation of the real UI code)
        run: bash tools/sim/screenshots.sh test
  stm32-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-stm32-${{ hashFiles('stm32-relay/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d stm32-relay
