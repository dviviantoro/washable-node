; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-3248s035]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.f_flash = 80000000L
build_unflags = -Os


lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@~8.3.11

build_flags =
    -O2
    ; OTA over plain HTTP is for bench tests against a laptop only; release builds must stay at 0
    -DOTA_ALLOW_HTTP=0
    ; ---------------- LVGL (no lv_conf.h needed) ----------------
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_USE_QRCODE=1
    -DLV_COLOR_16_SWAP=1
    -DLV_DISP_DEF_REFR_PERIOD=15
    -DLV_MEM_CUSTOM=1
    -DLV_INV_BUF_SIZE=128
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_48=1

    ; ---------------- TFT_eSPI (no User_Setup.h needed) ----------------
    -DUSER_SETUP_LOADED=1
    ; If the screen stays white/garbled, replace ST7796_DRIVER with ILI9488_DRIVER
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=80000000
    ; Try 80000000 for smoother animation if your panel is stable at it.
    ; If colors look wrong, enable one or both of these:
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_BGR